
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Campus - Productivity App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d7ff2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "streak-orange": "#ff6b00",
                        "neon-green": "#0bda5b",
                        "soft-pink": "#ff69b4",
                        "gold": "#FFD700",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #101922;
            color: white;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .mesh-gradient {
            background-color: #101922;
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 127, 242, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(13, 127, 242, 0.1) 0px, transparent 50%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .chart-bar-gradient { background: linear-gradient(to top, #0d7ff2, #4facfe); }
        .bar-glow { filter: drop-shadow(0 0 10px rgba(13, 127, 242, 0.5)); }
        .fire-glow { filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6)); }
        .metallic-gold { background: linear-gradient(135deg, #FFD700 0%, #FFF8DC 50%, #B8860B 100%); }
    </style>
